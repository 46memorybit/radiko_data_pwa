<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>radiko</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #000;
    }

    button {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
      background: #000;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      background: #222;
    }
  </style>
</head>

<body>

  <button onclick="openRadiko()">
    radikoを開く
  </button>

  <script>
    function openRadiko() {
      window.location.href = "https://radiko.jp/mobile";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>

</body>
</html>
